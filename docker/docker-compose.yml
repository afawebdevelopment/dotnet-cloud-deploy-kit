services:
  api:
    image: sample-api:prod
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sample-api
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api